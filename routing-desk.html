  function refreshCounts() {
    var list = visibleCards();
    var open = list.filter(function (c) { return !isDone(c); });
    var overdue = open.filter(function (c) { return daysUntil(c.due) !== null && daysUntil(c.due) < 0; }).length;
    var soon = open.filter(function (c) {
      var d = daysUntil(c.due);
      return d !== null && d >= 0 && d <= Number(S.config.dueSoonDays || 3);
    }).length;
    var stale = open.filter(function (c) { return daysSince(c.modified) >= Number(S.config.staleDays || 7); }).length;
    clear(UI.counts);
    UI.counts.appendChild(h("span.rd-count", { text: list.length + " shown" }));
    UI.counts.appendChild(h("span.rd-count", { text: open.length + " open" }));
    if (soon) { UI.counts.appendChild(h("span.rd-count.rd-count--warn", { text: soon + " due soon" })); }
    if (overdue) { UI.counts.appendChild(h("span.rd-count.rd-count--bad", { text: overdue + " overdue" })); }
    if (stale) { UI.counts.appendChild(h("span.rd-count", { text: stale + " untouched " + (S.config.staleDays || 7) + "d+" })); }
  }

  /* =========================================================
     10. views
     ========================================================= */

  function renderView() {
    closeMenu();
    clear(UI.view);
    if (S.view === "grid") { UI.view.appendChild(renderGrid()); }
    else if (S.view === "charts") { UI.view.appendChild(renderCharts()); }
    else { UI.view.appendChild(renderBoard()); }
  }

  /* ---------- board ---------- */

  function renderBoard() {
    var cards = visibleCards();
    var groups = groupsFor(cards);
    var wrap = h("div.rd-scroll");
    var board = h("div.rd-board", { role: "list" });

    groups.forEach(function (group) {
      board.appendChild(renderColumn(group));
    });

    if (S.groupBy === "bucket") {
      board.appendChild(h("div", { style: { flex: "0 0 210px" } }, [
        h("button.rd-btn", {
          type: "button", text: "+ Add bucket", style: { width: "100%" },
          on: { click: addBucket }
        })
      ]));
    }
    wrap.appendChild(board);
    return wrap;
  }

  function renderColumn(group) {
    var col = h("section.rd-col", { role: "listitem", style: { "--rd-col-tone": group.tone || "#5b6b78" } });
    var head = h("div.rd-col-head", {}, [
      h("h2.rd-col-name", { text: group.name, title: group.name }),
      h("span.rd-col-n", { text: String(group.cards.length) })
    ]);
    if (S.groupBy === "bucket") {
      head.appendChild(h("button.rd-btn.rd-btn--ghost.rd-btn--icon", {
        type: "button", text: "⋯", "aria-label": "Bucket actions for " + group.name,
        on: {
          click: function (e) {
            e.stopPropagation();
            menu(e.currentTarget, [
              { text: "Add card here", run: function () { openEditor(null, { bucket: group.key }); } },
              { text: "Rename bucket", run: function () { renameBucket(group.key); } },
              "-",
              { text: "Delete bucket", danger: true, run: function () { deleteBucket(group.key); } }
            ]);
          }
        }
      }));
    }
    col.appendChild(head);

    var drop = h("div.rd-drop", { "data-group": group.key });
    var list = sortCards(group.cards);
    var splitDone = S.groupBy !== "progress";
    var live = splitDone ? list.filter(function (c) { return !isDone(c); }) : list;
    var done = splitDone ? list.filter(isDone) : [];

    if (!live.length && !done.length) {
      drop.appendChild(h("div.rd-empty", { text: "Nothing here" }));
    } else {
      live.forEach(function (card) { drop.appendChild(renderCard(card)); });
    }

    if (done.length) {
      var expanded = S.doneOpen[group.key] || S.filter.progress === "Completed";
      drop.appendChild(h("button.rd-donebar", {
        type: "button", "aria-expanded": String(expanded),
        on: {
          click: function () {
            S.doneOpen[group.key] = !expanded;
            renderView();
          }
        }
      }, [
        h("span.rd-donecaret", { text: expanded ? "▾" : "▸" }),
        h("span", { text: "Completed" }),
        h("span.rd-col-n", { text: String(done.length) })
      ]));
      if (expanded) {
        done.forEach(function (card) { drop.appendChild(renderCard(card)); });
      }
    }

    if (group.droppable) { wireDrop(drop, group); }
    col.appendChild(drop);

    if (S.groupBy === "bucket") {
      col.appendChild(h("div.rd-col-foot", {}, [
        h("button.rd-btn.rd-btn--ghost.rd-btn--sm", {
          type: "button", text: "+ Add card", style: { width: "100%" },
          on: { click: function () { openEditor(null, { bucket: group.key }); } }
        })
      ]));
    }
    return col;
  }

  function renderCard(card) {
    var chk = checklistCount(card);
    var tone = dueTone(card);
    var node = h("article.rd-card" + (isDone(card) ? ".is-done" : ""), {
      draggable: S.groupBy !== "due",
      tabindex: 0,
      "data-id": String(card.id),
      "aria-label": card.title,
      on: {
        click: function (e) { if (!e.target.closest("button")) { openCard(card.id); } },
        keydown: function (e) {
          if (e.key === "Enter") { e.preventDefault(); openCard(card.id); }
          else if (e.key === "m" || e.key === "M") { e.preventDefault(); quickMove(card.id, node); }
          else if (e.key === "c" || e.key === "C") { e.preventDefault(); toggleComplete(card.id); }
        },
        dragstart: function (e) {
          e.dataTransfer.setData("text/plain", String(card.id));
          e.dataTransfer.effectAllowed = "move";
          node.classList.add("is-dragging");
        },
        dragend: function () { node.classList.remove("is-dragging"); }
      }
    });

    if ((card.labels || []).length) {
      node.appendChild(h("div.rd-chips", {}, card.labels.map(function (k) {
        var lab = cfgLabel(k);
        return h("span.rd-lab", { style: { "--rd-lab": lab.tone }, title: lab.name });
      })));
    }

    node.appendChild(h("div.rd-card-title", { text: card.title }));
    if (card.notes) { node.appendChild(h("div.rd-card-note", { text: card.notes })); }

    var meta = h("div.rd-card-meta");
    if (card.due) {
      meta.appendChild(h("span.rd-pill" + (tone ? ".rd-pill--" + tone : ""), { text: dueLabel(card) }));
    }
    if (chk.total) { meta.appendChild(h("span.rd-pill", { text: "☑ " + chk.done + "/" + chk.total })); }
    if (card.files) { meta.appendChild(h("span.rd-pill", { text: "🗎 " + card.files })); }
    if (card.comments) { meta.appendChild(h("span.rd-pill", { text: "💬 " + card.comments })); }
    if (S.groupBy !== "bucket") { meta.appendChild(h("span.rd-pill", { text: cfgBucket(card.bucket).name })); }
    if (meta.childNodes.length) { node.appendChild(meta); }

    var foot = h("div.rd-card-foot");
    if (card.priority && card.priority !== "Medium") {
      foot.appendChild(h("span.rd-prio" + (card.priority === "Urgent" ? ".rd-prio--urgent" : card.priority === "Low" ? ".rd-prio--low" : ""), {
        title: card.priority + " priority"
      }));
    }
    foot.appendChild(h("span.rd-pill", { text: card.progress }));
    foot.appendChild(h("button.rd-btn.rd-btn--ghost.rd-btn--icon.rd-cardmenu", {
      type: "button", text: "⋯", "aria-label": "Card actions",
      on: {
        click: function (e) {
          e.stopPropagation();
          cardMenu(card, e.currentTarget);
        }
      }
    }));
    var people = card.assignees || [];
    var avatars = h("div.rd-avatars");
    people.slice(0, 3).forEach(function (p) {
      avatars.appendChild(h("span.rd-av", { text: initials(p.name), title: p.name }));
    });
    if (people.length > 3) {
      avatars.appendChild(h("span.rd-av.rd-av--more", { text: "+" + (people.length - 3) }));
    }
    foot.appendChild(avatars);
    node.appendChild(foot);
    return node;
  }

  function cardMenu(card, anchor) {
    menu(anchor, [
      { text: "Open", run: function () { openCard(card.id); } },
      { text: isMine(card) ? "Remove me" : "Assign to me", run: function () { toggleMe(card.id); } },
      { text: isDone(card) ? "Reopen" : "Mark complete", run: function () { toggleComplete(card.id); } },
      { text: "Move to bucket…", run: function () { quickMove(card.id, anchor); } },
      "-",
      { text: "Copy link", run: function () { copyLink(card); } },
      { text: "Delete card", danger: true, disabled: !S.config.allowDelete, run: function () { removeCard(card.id); } }
    ]);
  }

  function wireDrop(zone, group) {
    zone.addEventListener("dragover", function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      zone.classList.add("is-over");
    });
    zone.addEventListener("dragleave", function (e) {
      if (!zone.contains(e.relatedTarget)) { zone.classList.remove("is-over"); }
    });
    zone.addEventListener("drop", function (e) {
      e.preventDefault();
      zone.classList.remove("is-over");
      var id = Number(e.dataTransfer.getData("text/plain"));
      var card = findCard(id);
      if (!card) { return; }
      var changes = {};
      if (S.groupBy === "bucket") {
        changes.bucket = group.key;
        changes.order = dropOrder(zone, e.clientY, id);
        if (group.key !== card.bucket && card.progress === "Not started") { changes.progress = "In progress"; }
      } else if (S.groupBy === "progress") {
        changes.progress = group.key;
      } else if (S.groupBy === "priority") {
        changes.priority = group.key;
      } else if (S.groupBy === "assignee") {
        changes.assignees = group.person ? [group.person] : [];
      }
      applyDrop(card, changes, group);
    });
  }

  function dropOrder(zone, y, movingId) {
    var siblings = qa(".rd-card", zone).filter(function (n) { return n.dataset.id !== String(movingId); });
    var before = null, after = null;
    for (var i = 0; i < siblings.length; i++) {
      var r = siblings[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) { after = findCard(Number(siblings[i].dataset.id)); break; }
      before = findCard(Number(siblings[i].dataset.id));
    }
    var lo = before ? before.order : (after ? after.order - 200 : 0);
    var hi = after ? after.order : lo + 200;
    return Math.round((lo + hi) / 2);
  }

  function applyDrop(card, changes, group) {
    var snapshot = {};
    Object.keys(changes).forEach(function (k) { snapshot[k] = card[k]; });
    Object.keys(changes).forEach(function (k) { card[k] = changes[k]; });
    renderView(); refreshCounts();
    var where = S.groupBy === "assignee"
      ? (group.person ? "Assigned to " + group.person.name : "Unassigned")
      : S.groupBy === "bucket" ? "Moved to " + group.name : "Set to " + group.name;
    saveCard(card, changes, where).then(function () {
      if (S.groupBy === "assignee" && group.person) { notifyAssignees(card, [group.person]); }
    }).catch(function (err) {
      Object.keys(snapshot).forEach(function (k) { card[k] = snapshot[k]; });
      renderView(); refreshCounts();
      if (err.conflict) { reload(); } else { fail(err, "Move failed"); }
    });
  }

  /* ---------- grid ---------- */

  var GRID_COLS = [
    { key: "title", label: "Card", get: function (c) { return c.title; } },
    { key: "bucket", label: "Bucket", get: function (c) { return cfgBucket(c.bucket).name; } },
    { key: "assignees", label: "Assigned to", get: function (c) { return (c.assignees || []).map(function (p) { return p.name; }).join(", "); } },
    { key: "progress", label: "Progress", get: function (c) { return c.progress; } },
    { key: "priority", label: "Priority", get: function (c) { return c.priority; } },
    { key: "due", label: "Due", get: function (c) { return c.due ? fmtDate(c.due) : ""; }, sort: function (c) { var d = daysUntil(c.due); return d === null ? 99999 : d; } },
    { key: "age", label: "Idle", get: function (c) { var d = daysSince(c.modified); return d === null ? "" : d + "d"; }, sort: function (c) { return -(daysSince(c.modified) || 0); } },
    { key: "files", label: "Docs", get: function (c) { return String(c.files || 0); }, sort: function (c) { return -(c.files || 0); } }
  ];

  function renderGrid() {
    var col = GRID_COLS.filter(function (c) { return c.key === S.sort.key; })[0] || GRID_COLS[5];
    var rows = visibleCards().slice().sort(function (a, b) {
      var va = col.sort ? col.sort(a) : String(col.get(a)).toLowerCase();
      var vb = col.sort ? col.sort(b) : String(col.get(b)).toLowerCase();
      if (va < vb) { return -1 * S.sort.dir; }
      if (va > vb) { return 1 * S.sort.dir; }
      return 0;
    });

    var head = h("tr", {}, GRID_COLS.map(function (c) {
      var attrs = {
        text: c.label + (S.sort.key === c.key ? (S.sort.dir === 1 ? "  ▲" : "  ▼") : ""),
        scope: "col",
        on: {
          click: function () {
            if (S.sort.key === c.key) { S.sort.dir *= -1; } else { S.sort = { key: c.key, dir: 1 }; }
            renderView();
          }
        }
      };
      if (S.sort.key === c.key) { attrs["aria-sort"] = S.sort.dir === 1 ? "ascending" : "descending"; }
      return h("th", attrs);
    }));

    var body = h("tbody", {}, rows.length ? rows.map(function (card) {
      return h("tr", {
        tabindex: 0,
        on: {
          click: function () { openCard(card.id); },
          keydown: function (e) { if (e.key === "Enter") { openCard(card.id); } }
        }
      }, GRID_COLS.map(function (c) {
        if (c.key === "due" && card.due) {
          var tone = dueTone(card);
          return h("td", {}, [h("span.rd-pill" + (tone ? ".rd-pill--" + tone : ""), { text: dueLabel(card) })]);
        }
        return h("td", { text: c.get(card) });
      }));
    }) : [h("tr", {}, [h("td", { colspan: String(GRID_COLS.length), text: "No cards match the current filters." })])]);

    return h("div.rd-tablewrap", {}, [
      h("table.rd-table", {}, [h("thead", {}, [head]), body])
    ]);
  }

  /* ---------- charts ---------- */

  function bars(title, subtitle, pairs, tone) {
    var max = Math.max.apply(null, pairs.map(function (p) { return p[1]; }).concat([1]));
    var panel = h("section.rd-panel", {}, [
      h("h3.rd-panel-h", { text: title }),
      h("div.rd-panel-s", { text: subtitle })
    ]);
    if (!pairs.length) {
      panel.appendChild(h("div.rd-empty", { text: "Nothing to chart yet" }));
      return panel;
    }
    pairs.forEach(function (p) {
      panel.appendChild(h("div.rd-barrow", { title: p[0] + ": " + p[1] }, [
        h("span.rd-barname", { text: p[0] }),
        h("div.rd-bartrack", {}, [
          h("div.rd-barfill", {
            style: {
              width: (p[1] ? Math.max(3, Math.round((p[1] / max) * 100)) : 0) + "%",
              "--rd-bar": p[2] || tone || "var(--rd-accent)"
            }
          })
        ]),
        h("span.rd-barval", { text: String(p[1]) })
      ]));
    });
    return panel;
  }

  function renderCharts() {
    var list = visibleCards();
    var open = list.filter(function (c) { return !isDone(c); });
    var overdue = open.filter(function (c) { var d = daysUntil(c.due); return d !== null && d < 0; });
    var soon = open.filter(function (c) {
      var d = daysUntil(c.due);
      return d !== null && d >= 0 && d <= Number(S.config.dueSoonDays || 3);
    });
    var stale = open.filter(function (c) { return daysSince(c.modified) >= Number(S.config.staleDays || 7); });

    var tiles = h("section.rd-panel", {}, [
      h("h3.rd-panel-h", { text: "Where the board stands" }),
      h("div.rd-panel-s", { text: "Cards matching current filters" }),
      h("div.rd-tiles", {}, [
        tile(open.length, "Open"),
        tile(list.length - open.length, "Completed"),
        tile(soon.length, "Due soon", soon.length ? "var(--rd-warn)" : null),
        tile(overdue.length, "Overdue", overdue.length ? "var(--rd-danger)" : null),
        tile(stale.length, "Idle " + (S.config.staleDays || 7) + "d+")
      ])
    ]);

    var byBucket = S.config.buckets.map(function (b) {
      return [b.name, open.filter(function (c) { return c.bucket === b.key; }).length];
    });
    var byPerson = {};
    open.forEach(function (c) {
      (c.assignees || []).forEach(function (p) { byPerson[p.name] = (byPerson[p.name] || 0) + 1; });
    });
    var people = Object.keys(byPerson).map(function (n) { return [n, byPerson[n]]; })
      .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 10);
    var unassigned = open.filter(function (c) { return !(c.assignees || []).length; }).length;
    if (unassigned) { people.push(["Unassigned", unassigned]); }

    var byPriority = PRIORITY.map(function (p) {
      var tone = p === "Urgent" ? "var(--rd-danger)" : p === "Important" ? "var(--rd-warn)" : "var(--rd-accent)";
      return [p, open.filter(function (c) { return c.priority === p; }).length, tone];
    });

    var ageBands = [["0-2 days", 0], ["3-6 days", 0], ["7-13 days", 0], ["14+ days", 0]];
    open.forEach(function (c) {
      var d = daysSince(c.modified) || 0;
      var i = d < 3 ? 0 : d < 7 ? 1 : d < 14 ? 2 : 3;
      ageBands[i][1]++;
    });

    return h("div.rd-charts", {}, [
      tiles,
      bars("Open cards by bucket", "Where work is piling up", byBucket),
      bars("Open cards by person", "Top 10 by workload", people),
      bars("Open cards by priority", "Priority mix", byPriority),
      bars("Time since last update", "Idle cards need a nudge", ageBands)
    ]);
  }

  function tile(n, label, tone) {
    return h("div.rd-tile", {}, [
      h("div.rd-tile-n", { text: String(n), style: tone ? { color: tone } : {} }),
      h("div.rd-tile-l", { text: label })
    ]);
  }

  /* =========================================================
     11. modal shell
     ========================================================= */

  function openModal(opts) {
    S.lastFocus = document.activeElement;

    var body = h("div.rd-modal-b");
    if (opts.body) { body.appendChild(opts.body); }

    var footer = h("div.rd-modal-f");
    (opts.actions || [{ text: "Close", close: true }]).forEach(function (a) {
      if (a.spacer) { footer.insertBefore(h("div.rd-spacer"), footer.firstChild); return; }
      footer.appendChild(h("button.rd-btn" + (a.primary ? ".rd-btn--primary" : a.danger ? ".rd-btn--danger" : ""), {
        type: "button", text: a.text,
        on: {
          click: function (e) {
            var keep = a.run ? a.run(e.currentTarget) : null;
            if (a.close !== false && keep !== false) { closeModal(); }
          }
        }
      }));
    });

    var modal = h("section.rd-modal" + (opts.wide ? ".rd-modal--wide" : ""), {
      role: "dialog", "aria-modal": "true", "aria-label": opts.title
    }, [
      h("div.rd-modal-h", {}, [
        h("h2.rd-modal-t", { text: opts.title }),
        opts.headerExtra || null,
        h("button.rd-btn.rd-btn--ghost.rd-btn--icon", {
          type: "button", text: "✕", "aria-label": "Close", on: { click: closeModal }
        })
      ]),
      body,
      opts.actions === false ? null : footer
    ]);

    var veil = h("div.rd-veil", {
      on: {
        mousedown: function (e) { if (e.target === veil && opts.dismissable !== false) { closeModal(); } }
      }
    }, [modal]);

    APP.appendChild(veil);
    S.modal = { veil: veil, modal: modal, body: body, footer: footer, restore: S.lastFocus };
    S.modalStack.push(S.modal);

    var focusable = "button:not([disabled]),input:not([type=hidden]),select,textarea,[tabindex='0']";
    veil.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.stopPropagation(); closeModal(); return; }
      if (e.key !== "Tab") { return; }
      var items = qa(focusable, modal).filter(function (n) { return n.offsetParent !== null; });
      if (!items.length) { return; }
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    var target = body.querySelector("input:not([type=hidden]),textarea,select,button") ||
      modal.querySelector("button");
    if (target) { target.focus(); }
    return S.modal;
  }

  function closeModal() {
    closeMenu();
    var top = S.modalStack.pop();
    if (top && top.onClose) { try { top.onClose(); } catch (e) { /* noop */ } }
    if (top && top.veil.parentNode) { top.veil.parentNode.removeChild(top.veil); }
    S.modal = S.modalStack[S.modalStack.length - 1] || null;
    if (top && top.restore && top.restore.focus) { try { top.restore.focus(); } catch (e) { /* noop */ } }
  }

  function confirmBox(title, message, confirmText, run, danger) {
    openModal({
      title: title,
      body: h("div", { text: message, style: { "font-size": "13.5px", "line-height": "1.5" } }),
      actions: [
        { text: "Cancel" },
        { text: confirmText, primary: !danger, danger: danger, run: run }
      ]
    });
  }

  function field(label, control, wide) {
    var simple = /^(INPUT|SELECT|TEXTAREA)$/.test(control.tagName || "");
    return h((simple ? "label" : "div") + ".rd-field" + (wide ? ".rd-wide" : ""), {}, [
      h("span.rd-label", { text: label }), control
    ]);
  }

  /* =========================================================
     12. people picker
     ========================================================= */

  function peoplePicker(selected, onChange) {
    var wrap = h("div.rd-people");
    var tokens = h("div.rd-tokens");
    var input = h("input.rd-input", { type: "text", placeholder: "Type a name, then pick from the list", autocomplete: "off" });
    var menuBox = h("div.rd-people-menu", { hidden: true });
    var active = -1, current = [];

    function paint() {
      clear(tokens);
      selected.forEach(function (p) {
        tokens.appendChild(h("span.rd-token", {}, [
          h("span.rd-av", { text: initials(p.name), title: p.name }),
          h("span", { text: p.name }),
          h("button.rd-x", {
            type: "button", text: "×", "aria-label": "Remove " + p.name,
            on: {
              click: function () {
                selected.splice(selected.indexOf(p), 1);
                paint(); onChange(selected, null);
              }
            }
          })
        ]));
      });
    }

    function hide() { menuBox.hidden = true; clear(menuBox); active = -1; current = []; }

    function pick(person) {
      hide();
      input.value = "";
      DATA.ensureUser(person.login).then(function (user) {
        if (selected.some(function (p) { return p.id === user.id; })) { return; }
        selected.push({ id: user.id, name: user.name || person.name, email: user.email || person.email });
        paint();
        onChange(selected, { id: user.id, name: user.name || person.name, email: user.email || person.email });
      }).catch(function (err) { fail(err, "Could not resolve user"); });
    }

    function highlight() {
      qa(".rd-person", menuBox).forEach(function (n, i) { n.classList.toggle("is-active", i === active); });
    }

    var search = debounce(function () {
      var text = input.value.trim();
      if (text.length < 2) { hide(); return; }
      DATA.searchPeople(text).then(function (people) {
        clear(menuBox);
        current = people;
        if (!people.length) {
          menuBox.appendChild(h("div", { text: "No matches", style: { padding: "9px 10px", color: "var(--rd-muted)", "font-size": "12.5px" } }));
        } else {
          people.forEach(function (p, i) {
            menuBox.appendChild(h("button.rd-person", {
              type: "button",
              on: {
                click: function () { pick(p); },
                mouseenter: function () { active = i; highlight(); }
              }
            }, [
              h("span.rd-av", { text: initials(p.name) }),
              h("span", {}, [h("div.rd-person-n", { text: p.name }), h("div.rd-person-e", { text: p.email || "" })])
            ]));
          });
        }
        menuBox.hidden = false;
        active = -1;
      }).catch(function () { hide(); });
    }, 260);

    input.addEventListener("input", search);
    input.addEventListener("keydown", function (e) {
      if (menuBox.hidden) { return; }
      if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, current.length - 1); highlight(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); highlight(); }
      else if (e.key === "Enter") { e.preventDefault(); if (current[active]) { pick(current[active]); } }
      else if (e.key === "Escape") { hide(); }
    });
    input.addEventListener("blur", function () { setTimeout(hide, 180); });

    paint();
    wrap.appendChild(tokens);
    wrap.appendChild(input);
    wrap.appendChild(menuBox);
    return wrap;
  }

  /* Comment box with @mention autocomplete. Typing @ then a couple of letters
     searches the directory; picking someone inserts their name and adds them to
     the notify list for this comment. */
  function mentionComposer(placeholder) {
    var wrap = h("div.rd-people");
    var ta = h("textarea.rd-textarea.rd-textarea--sm", { placeholder: placeholder });
    var menuBox = h("div.rd-people-menu", { hidden: true });
    var mentions = [];
    var current = [], active = -1;

    function token() {
      var pos = ta.selectionStart;
      var upto = ta.value.slice(0, pos);
      var m = /(?:^|\s)@([^\s@]{0,40})$/.exec(upto);
      if (!m) { return null; }
      return { start: pos - m[1].length - 1, end: pos, query: m[1] };
    }
    function hide() { menuBox.hidden = true; clear(menuBox); current = []; active = -1; }
    function highlight() {
      qa(".rd-person", menuBox).forEach(function (n, i) { n.classList.toggle("is-active", i === active); });
    }
    function insert(person) {
      var t = token();
      if (!t) { hide(); return; }
      DATA.ensureUser(person.login).then(function (user) {
        var name = user.name || person.name;
        var head = ta.value.slice(0, t.start) + "@" + name + " ";
        ta.value = head + ta.value.slice(t.end);
        ta.setSelectionRange(head.length, head.length);
        if (!mentions.some(function (x) { return x.id === user.id; })) {
          mentions.push({ id: user.id, name: name, email: user.email || person.email || "" });
        }
        hide();
        ta.focus();
      }).catch(function (err) { hide(); fail(err, "Could not resolve user"); });
    }

    var look = debounce(function () {
      var t = token();
      if (!t || t.query.length < 1) { hide(); return; }
      DATA.searchPeople(t.query).then(function (people) {
        clear(menuBox);
        current = people;
        if (!people.length) { hide(); return; }
        people.forEach(function (p, i) {
          menuBox.appendChild(h("button.rd-person", {
            type: "button",
            on: {
              mousedown: function (e) { e.preventDefault(); insert(p); },
              mouseenter: function () { active = i; highlight(); }
            }
          }, [
            h("span.rd-av", { text: initials(p.name) }),
            h("span", {}, [h("div.rd-person-n", { text: p.name }), h("div.rd-person-e", { text: p.email || "" })])
          ]));
        });
        menuBox.hidden = false;
        active = 0;
        highlight();
      }).catch(hide);
    }, 200);

    ta.addEventListener("input", look);
    ta.addEventListener("keydown", function (e) {
      if (menuBox.hidden) { return; }
      if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, current.length - 1); highlight(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); highlight(); }
      else if (e.key === "Enter" || e.key === "Tab") {
        if (current[active]) { e.preventDefault(); insert(current[active]); }
      } else if (e.key === "Escape") { e.preventDefault(); hide(); }
    });
    ta.addEventListener("blur", function () { setTimeout(hide, 200); });

    wrap.appendChild(ta);
    wrap.appendChild(menuBox);
    return {
      wrap: wrap, input: ta, mentions: mentions,
      reset: function () { ta.value = ""; mentions.length = 0; hide(); }
    };
  }

  function escapeRe(v) { return String(v).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function paintCommentText(node, text, mentions) {
    var names = (mentions || []).map(function (m) { return m.name; })
      .filter(Boolean).sort(function (a, b) { return b.length - a.length; });
    if (!names.length) { node.textContent = text; return; }
    var re = new RegExp("@(" + names.map(escapeRe).join("|") + ")", "g");
    var last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) { node.appendChild(document.createTextNode(text.slice(last, m.index))); }
      node.appendChild(h("span.rd-mention", { text: "@" + m[1] }));
      last = m.index + m[0].length;
    }
    node.appendChild(document.createTextNode(text.slice(last)));
  }

  /* =========================================================
     13. card editor / detail
     ========================================================= */

  function newDraft(presets) {
    var p = presets || {};
    return {
      isNew: true,
      title: "",
      key: "RD-" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + "-" + uid().slice(0, 4).toUpperCase(),
      bucket: p.bucket || (S.config.buckets[0] || {}).key,
      order: (Math.max.apply(null, S.cards.map(function (c) { return c.order || 0; }).concat([0])) + 100),
      progress: "Not started",
      priority: "Medium",
      start: null, due: null, completed: null,
      notes: "", assignees: [], labels: [], checklist: [],
      files: 0, comments: 0, folder: ""
    };
  }

  function openEditor(card, presets) {
    var model = card || newDraft(presets);
    var queued = [];
    var saveNote = h("span.rd-note-d", { text: "" });
    var body = h("div");

    function commit(changes, note) {
      Object.keys(changes).forEach(function (k) { model[k] = changes[k]; });
      if (model.isNew) { return Promise.resolve(); }
      saveNote.textContent = "Saving…";
      return saveCard(model, changes, note).then(function () {
        saveNote.textContent = "Saved " + new Date().toLocaleTimeString();
        renderView(); refreshCounts();
      }).catch(function (err) {
        saveNote.textContent = "";
        if (err.conflict) { closeModal(); reload(); } else { fail(err, "Save failed"); }
      });
    }

    /* --- core fields --- */
    var title = h("input.rd-input", {
      type: "text", value: model.title, placeholder: "What is being routed?",
      on: { change: function (e) { commit({ title: e.target.value.trim() || "(untitled)" }); } }
    });

    var bucketSel = h("select.rd-select", {
      on: { change: function (e) { commit({ bucket: e.target.value }, "Moved to " + cfgBucket(e.target.value).name); } }
    }, S.config.buckets.map(function (b) {
      return h("option", { value: b.key, text: b.name, selected: b.key === model.bucket });
    }));

    var progSel = h("select.rd-select", {
      on: {
        change: function (e) {
          var changes = { progress: e.target.value };
          changes.completed = e.target.value === "Completed" ? new Date().toISOString() : null;
          commit(changes, "Progress set to " + e.target.value);
        }
      }
    }, PROGRESS.map(function (p) { return h("option", { value: p, text: p, selected: p === model.progress }); }));

    var prioSel = h("select.rd-select", {
      on: { change: function (e) { commit({ priority: e.target.value }); } }
    }, PRIORITY.map(function (p) { return h("option", { value: p, text: p, selected: p === model.priority }); }));

    var startInput = h("input.rd-input.rd-input--date", {
      type: "date", value: dayKey(model.start),
      on: { change: function (e) { commit({ start: e.target.value ? new Date(e.target.value + "T12:00:00").toISOString() : null }); } }
    });
    var dueInput = h("input.rd-input.rd-input--date", {
      type: "date", value: dayKey(model.due),
      on: { change: function (e) { commit({ due: e.target.value ? new Date(e.target.value + "T12:00:00").toISOString() : null }); } }
    });

    var notes = h("textarea.rd-textarea", {
      value: model.notes, placeholder: "Why is this routing, and what does the next person need to do?",
      on: { change: function (e) { commit({ notes: e.target.value }); } }
    });

    var picker = peoplePicker(model.assignees.slice(), function (list, added) {
      commit({ assignees: list.slice() }, added ? "Assigned to " + added.name : "Assignment changed");
      if (added && !model.isNew) { notifyAssignees(model, [added]); }
    });

    /* --- labels --- */
    var labelGrid = h("div.rd-labgrid");
    function paintLabels() {
      clear(labelGrid);
      S.config.labels.forEach(function (lab) {
        var on = model.labels.indexOf(lab.key) > -1;
        labelGrid.appendChild(h("button.rd-labpick", {
          type: "button", "aria-pressed": String(on),
          on: {
            click: function () {
              var next = model.labels.slice();
              var at = next.indexOf(lab.key);
              if (at > -1) { next.splice(at, 1); } else { next.push(lab.key); }
              commit({ labels: next });
              paintLabels();
            }
          }
        }, [h("span.rd-labdot", { style: { "--rd-lab": lab.tone } }), h("span", { text: lab.name })]));
      });
    }
    paintLabels();

    /* --- checklist --- */
    var checkWrap = h("div.rd-list");
    function paintChecklist() {
      clear(checkWrap);
      model.checklist.forEach(function (item) {
        var row = h("div.rd-row" + (item.done ? ".is-done" : ""));
        row.appendChild(h("input", {
          type: "checkbox", checked: item.done, "aria-label": "Done: " + item.text,
          on: {
            change: function (e) {
              item.done = e.target.checked;
              commit({ checklist: model.checklist.slice() });
              paintChecklist();
            }
          }
        }));
        row.appendChild(h("input.rd-input.rd-row-main", {
          type: "text", value: item.text,
          on: { change: function (e) { item.text = e.target.value; commit({ checklist: model.checklist.slice() }); } }
        }));
        row.appendChild(h("button.rd-x", {
          type: "button", text: "×", "aria-label": "Remove step",
          on: {
            click: function () {
              model.checklist = model.checklist.filter(function (i) { return i !== item; });
              commit({ checklist: model.checklist.slice() });
              paintChecklist();
            }
          }
        }));
        checkWrap.appendChild(row);
      });
      var add = h("input.rd-input", {
        type: "text", placeholder: "Add a step, press Enter",
        on: {
          keydown: function (e) {
            if (e.key !== "Enter") { return; }
            e.preventDefault();
            var text = e.target.value.trim();
            if (!text) { return; }
            model.checklist.push({ id: uid(), text: text, done: false, show: true });
            commit({ checklist: model.checklist.slice() });
            paintChecklist();
            var next = checkWrap.querySelector("input[placeholder^='Add a step']");
            if (next) { next.focus(); }
          }
        }
      });
      checkWrap.appendChild(add);
    }
    paintChecklist();

    /* --- documents --- */
    var fileInput = h("input", { type: "file", multiple: true, hidden: true });
    var dropZone = h("div.rd-drop-zone", {}, [
      h("div", { text: "Drop documents here" }),
      h("div.rd-hint", {
        text: model.isNew
          ? "Adding a document creates the card and uploads straight away."
          : "Uploads as soon as you drop or pick them."
      }),
      h("div", { style: { "margin-top": "8px" } }, [
        h("button.rd-btn.rd-btn--sm", { type: "button", text: "Browse files", on: { click: function () { fileInput.click(); } } })
      ])
    ]);
    var fileList = h("div.rd-list");

    function acceptFiles(list) {
      var files = Array.prototype.slice.call(list || []);
      if (!files.length) { return; }
      if (model.isNew) {
        if (!title.value.trim()) {
          toast("Give the card a title first, then add documents.", "bad");
          title.focus();
          return;
        }
        model.title = title.value.trim();
        model.notes = notes.value;
        dropZone.classList.add("is-over");
        createCard(model, []).then(function (card) {
          return DATA.uploadFiles(card, files).then(function (res) {
            return DATA.updateCard(card, { files: files.length, folder: res.folder }).then(function () {
              card.files = files.length;
              card.folder = res.folder;
              return DATA.addLog(card.key, "event", "Documents added",
                files.map(function (f) { return f.name; }).join(", "));
            });
          }).then(function () {
            dropZone.classList.remove("is-over");
            toast(files.length + " file(s) uploaded", "good");
            closeModal();
            renderView(); refreshCounts();
            openEditor(card);
          });
        }).catch(function (err) {
          dropZone.classList.remove("is-over");
          fail(err, "Upload failed");
        });
        return;
      }
      dropZone.classList.add("is-over");
      DATA.uploadFiles(model, files).then(function (res) {
        dropZone.classList.remove("is-over");
        return commit({ files: (model.files || 0) + files.length, folder: res.folder }, null).then(function () {
          return DATA.addLog(model.key, "event", "Documents added", files.map(function (f) { return f.name; }).join(", "));
        });
      }).then(function () {
        toast(files.length + " file(s) uploaded", "good");
        return paintFiles();
      }).catch(function (err) { dropZone.classList.remove("is-over"); fail(err, "Upload failed"); });
    }

    function paintFiles() {
      if (model.isNew) { clear(fileList); return Promise.resolve(); }
      return DATA.listFiles(model).then(function (files) {
        clear(fileList);
        if (!files.length) { fileList.appendChild(h("div.rd-empty", { text: "No documents attached" })); return; }
        files.forEach(function (f) {
          fileList.appendChild(h("div.rd-row", {}, [
            h("div.rd-row-main", {}, [h("div.rd-row-t", { text: f.name })]),
            h("button.rd-btn.rd-btn--sm", {
              type: "button", text: "Open",
              on: { click: function () { window.open(f.url, "_blank", "noopener"); } }
            }),
            h("button.rd-btn.rd-btn--sm.rd-btn--danger", {
              type: "button", text: "Remove", disabled: !S.config.allowDelete,
              on: {
                click: function () {
                  confirmBox("Remove document?", f.name + " goes to the site recycle bin. The card stays.",
                    "Remove", function () {
                      DATA.deleteFile(f.url).then(function () {
                        return commit({ files: Math.max(0, (model.files || 1) - 1) });
                      }).then(function () {
                        return DATA.addLog(model.key, "event", "Document removed", f.name);
                      }).then(paintFiles).catch(function (e) { fail(e, "Remove failed"); });
                    }, true);
                }
              }
            })
          ]));
        });
      });
    }

    fileInput.addEventListener("change", function () { acceptFiles(fileInput.files); fileInput.value = ""; });
    dropZone.addEventListener("dragover", function (e) { e.preventDefault(); dropZone.classList.add("is-over"); });
    dropZone.addEventListener("dragleave", function () { dropZone.classList.remove("is-over"); });
    dropZone.addEventListener("drop", function (e) {
      e.preventDefault(); dropZone.classList.remove("is-over"); acceptFiles(e.dataTransfer.files);
    });

    /* --- comments + activity --- */
    var composer = mentionComposer("Comment, or type @ to notify someone");
    var commentBox = composer.input;
    var commentFeed = h("div.rd-feed");
    var activityFeed = h("div.rd-feed");

    function paintThread() {
      if (model.isNew) { return Promise.resolve(); }
      return DATA.loadThread(model.key).then(function (entries) {
        var comments = entries.filter(function (e) { return e.kind === "comment"; });
        var events = entries.filter(function (e) { return e.kind !== "comment"; });
        clear(commentFeed); clear(activityFeed);
        if (!comments.length) { commentFeed.appendChild(h("div.rd-empty", { text: "No comments yet" })); }
        comments.forEach(function (c) {
          var line = h("div.rd-note-b");
          paintCommentText(line, c.text, c.mentions);
          commentFeed.appendChild(h("div.rd-note", {}, [
            h("div.rd-note-h", {}, [h("span.rd-note-w", { text: c.who || "Someone" }), h("span.rd-note-d", { text: fmtWhen(c.when) })]),
            line
          ]));
        });
        if (!events.length) { activityFeed.appendChild(h("div.rd-empty", { text: "No activity recorded" })); }
        events.forEach(function (e) {
          activityFeed.appendChild(h("div.rd-note", {}, [
            h("div.rd-note-h", {}, [h("span.rd-note-w", { text: e.type || "Update" }), h("span.rd-note-d", { text: (e.who || "") + " · " + fmtWhen(e.when) })]),
            e.text ? h("div.rd-note-b", { text: e.text }) : null
          ]));
        });
      });
    }

    /* --- assemble --- */
    body.appendChild(field("Title", title, true));
    var grid = h("div.rd-grid3", {}, [
      field("Bucket", bucketSel),
      field("Progress", progSel),
      field("Priority", prioSel),
      field("Due date", dueInput),
      field("Start date", startInput)
    ]);
    body.appendChild(grid);
    body.appendChild(field("Assigned to", picker, true));
    body.appendChild(field("Labels", labelGrid, true));
    body.appendChild(field("Notes", notes, true));

    body.appendChild(h("h3.rd-sec", { text: "Checklist" }));
    body.appendChild(checkWrap);

    body.appendChild(h("h3.rd-sec", { text: "Documents" }));
    body.appendChild(dropZone);
    body.appendChild(fileInput);
    body.appendChild(fileList);

    if (!model.isNew) {
      body.appendChild(h("h3.rd-sec", { text: "Comments" }));
      body.appendChild(composer.wrap);
      body.appendChild(h("div", { style: { margin: "6px 0 10px" } }, [
        h("button.rd-btn.rd-btn--primary.rd-btn--sm", {
          type: "button", text: "Post comment",
          on: {
            click: function () {
              var text = commentBox.value.trim();
              if (!text) { return; }
              var said = composer.mentions.slice();
              composer.reset();
              DATA.addLog(model.key, "comment", "", text, said)
                .then(function () { return commit({ comments: (model.comments || 0) + 1 }); })
                .then(paintThread)
                .then(function () {
                  if (said.length) { return notifyMention(model, text, said); }
                  if (S.config.notify.onComment) { return notifyComment(model, text); }
                })
                .catch(function (err) { fail(err, "Comment failed"); });
            }
          }
        })
      ]));
      body.appendChild(commentFeed);

      body.appendChild(h("h3.rd-sec", { text: "Activity" }));
      body.appendChild(activityFeed);
    }

    var actions = model.isNew
      ? [{ text: "Cancel" }, {
        text: "Create card", primary: true, close: false,
        run: function (btn) {
          if (!title.value.trim()) { title.focus(); toast("Give the card a title first.", "bad"); return false; }
          btn.disabled = true;
          model.title = title.value.trim();
          model.notes = notes.value;
          createCard(model, queued).then(function () { closeModal(); })
            .catch(function (err) { btn.disabled = false; fail(err, "Create failed"); });
          return false;
        }
      }]
      : [
        { text: "Delete", danger: true, close: false, run: function () { removeCard(model.id); } },
        { spacer: true },
        {
          text: isDone(model) ? "Reopen card" : "Mark complete", close: false,
          run: function () { toggleComplete(model.id); closeModal(); }
        },
        { text: "Close", primary: true }
      ];

    var extras = model.isNew ? null : h("div", {
      style: { "text-align": "right", "flex": "none", "margin-right": "6px" }
    }, [
      h("div.rd-note-d", { text: model.key }),
      saveNote
    ]);

    /* Autosave. Every control already commits on change; this catches the case
       where someone types and then clicks straight off the card without blurring
       the field, and gives typed text a periodic save while they work. */
    function flushEdits() {
      if (model.isNew) { return; }
      var pending = {};
      var typed = title.value.trim() || "(untitled)";
      if (typed !== model.title) { pending.title = typed; }
      if (notes.value !== model.notes) { pending.notes = notes.value; }
      if (Object.keys(pending).length) { commit(pending); }
    }
    var autosave = debounce(flushEdits, 900);
    title.addEventListener("input", autosave);
    notes.addEventListener("input", autosave);

    openModal({
      title: model.isNew ? "New routing card" : model.title,
      wide: true, body: body, actions: actions, headerExtra: extras
    });
    S.modal.onClose = flushEdits;

    if (!model.isNew) { paintFiles(); paintThread(); }
  }

  /* =========================================================
     14. mutations
     ========================================================= */

  function findCard(id) {
    return S.cards.filter(function (c) { return c.id === id; })[0];
  }

  function saveCard(card, changes, note) {
    return DATA.updateCard(card, changes).then(function () {
      if (DATA.refreshEtag) {
        DATA.refreshEtag(card).then(function (tag) { card.etag = tag; }).catch(function () { card.etag = "*"; });
      }
      card.modified = new Date().toISOString();
      if (note) { DATA.addLog(card.key, "event", note, "").catch(function () { /* non-fatal */ }); }
    });
  }

  function createCard(model, queued) {
    var payload = {
      title: model.title, key: model.key, bucket: model.bucket, order: model.order,
      progress: model.progress, priority: model.priority, start: model.start, due: model.due,
      completed: model.completed, notes: model.notes, assignees: model.assignees,
      labels: model.labels, checklist: model.checklist, files: 0, comments: 0, folder: ""
    };
    return DATA.createCard(payload).then(function (card) {
      S.cards.push(card);
      renderView(); refreshCounts();
      var chain = DATA.addLog(card.key, "event", "Created",
        "Card created in " + cfgBucket(card.bucket).name + ".");
      if (queued && queued.length) {
        chain = chain.then(function () {
          return DATA.uploadFiles(card, queued).then(function (res) {
            return DATA.updateCard(card, { files: queued.length, folder: res.folder }).then(function () {
              card.files = queued.length; card.folder = res.folder;
            });
          });
        });
      }
      return chain.then(function () {
        toast("Card created" + (queued && queued.length ? " with " + queued.length + " document(s)" : ""), "good");
        renderView(); refreshCounts();
        if (card.assignees.length) { notifyAssignees(card, card.assignees); }
        return card;
      });
    });
  }

  function removeCard(id) {
    var card = findCard(id);
    if (!card) { return; }
    if (!S.config.allowDelete) { toast("Deleting cards is turned off in Settings.", "bad"); return; }
    confirmBox("Delete this card?", "\"" + card.title + "\" goes to the site recycle bin. Documents stay in " +
      L.docs + " unless removed separately.", "Delete", function () {
        DATA.deleteCard(card).then(function () {
          S.cards = S.cards.filter(function (c) { return c.id !== id; });
          closeModal(); renderView(); refreshCounts();
          toast("Card deleted", "good");
        }).catch(function (err) { fail(err, "Delete failed"); });
      }, true);
  }

  function toggleComplete(id) {
    var card = findCard(id);
    if (!card) { return; }
    var done = isDone(card);
    var changes = {
      progress: done ? "In progress" : "Completed",
      completed: done ? null : new Date().toISOString()
    };
    Object.keys(changes).forEach(function (k) { card[k] = changes[k]; });
    renderView(); refreshCounts();
    saveCard(card, changes, done ? "Reopened" : "Marked complete").catch(function (err) { fail(err, "Update failed"); });
  }

  function toggleMe(id) {
    var card = findCard(id);
    if (!card) { return; }
    var mine = isMine(card);
    var next = mine
      ? card.assignees.filter(function (p) { return p.id !== S.me.Id; })
      : card.assignees.concat([{ id: S.me.Id, name: S.me.Title, email: S.me.Email }]);
    card.assignees = next;
    renderView();
    saveCard(card, { assignees: next }, mine ? "Unassigned self" : "Assigned to " + S.me.Title)
      .then(function () {
        if (!mine) {
          return notifyAssignees(card, [{ id: S.me.Id, name: S.me.Title, email: S.me.Email }]);
        }
      })
      .catch(function (err) { fail(err, "Update failed"); });
  }

  function quickMove(id, anchor) {
    var card = findCard(id);
    if (!card || !anchor) { return; }
    menu(anchor, S.config.buckets.map(function (b) {
      return {
        text: (b.key === card.bucket ? "• " : "   ") + b.name,
        run: function () {
          if (b.key === card.bucket) { return; }
          card.bucket = b.key;
          renderView(); refreshCounts();
          saveCard(card, { bucket: b.key }, "Moved to " + b.name).catch(function (err) { fail(err, "Move failed"); });
        }
      };
    }));
  }

  function cardLink(card) {
    return location.href.split("#")[0] + "#rdcard=" + encodeURIComponent(card.key);
  }

  function copyLink(card) {
    var url = cardLink(card);
    var done = function () { toast("Link copied", "good"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(function () { window.prompt("Copy this link", url); });
    } else { window.prompt("Copy this link", url); }
  }

  function notifyAssignees(card, people) {
    if (!S.config.notify.enabled || !S.config.notify.onAssign) { return Promise.resolve(); }
    var to = people.map(function (p) { return p.email; }).filter(function (e) { return e && e.indexOf("@") > 0; });
    if (!to.length) { return Promise.resolve(); }
    var subject = (S.config.notify.subjectTag || "[Routing Desk]") + " " + card.title;
    var body = [
      "<p>You have a routing card in <strong>" + escapeHtml(S.config.planName) + "</strong>.</p>",
      "<p><strong>" + escapeHtml(card.title) + "</strong><br>",
      "Bucket: " + escapeHtml(cfgBucket(card.bucket).name) + "<br>",
      "Due: " + (card.due ? escapeHtml(fmtDate(card.due)) : "no due date") + "<br>",
      "Assigned by: " + escapeHtml(S.me.Title) + "</p>",
      card.notes ? "<p>" + escapeHtml(card.notes) + "</p>" : "",
      '<p><a href="' + escapeHtml(cardLink(card)) + '">Open the card</a></p>'
    ].join("");
    return DATA.sendMail(to, subject, body).then(function () {
      if (DATA.kind === "live") { toast("Emailed " + to.join(", "), "good"); }
    }).catch(function (err) {
      logDiag("Mail failed: " + err.message);
      toast("Saved, but the email did not send: " + String(err.message).slice(0, 160), "bad", 9000);
    });
  }

  function notifyComment(card, text) {
    var to = (card.assignees || []).map(function (p) { return p.email; })
      .filter(function (e) { return e && e.indexOf("@") > 0 && e !== S.me.Email; });
    if (!to.length || !S.config.notify.enabled) { return Promise.resolve(); }
    return DATA.sendMail(to,
      (S.config.notify.subjectTag || "[Routing Desk]") + " Comment on " + card.title,
      "<p>" + escapeHtml(S.me.Title) + " commented:</p><p>" + escapeHtml(text) + "</p>" +
      '<p><a href="' + escapeHtml(cardLink(card)) + '">Open the card</a></p>'
    ).catch(function () { /* non-fatal */ });
  }

  function notifyMention(card, text, people) {
    if (!S.config.notify.enabled) { return Promise.resolve(); }
    var to = people.map(function (p) { return p.email; })
      .filter(function (e) { return e && e.indexOf("@") > 0; });
    if (!to.length) { return Promise.resolve(); }
    return DATA.sendMail(to,
      (S.config.notify.subjectTag || "[Routing Desk]") + " " + S.me.Title + " mentioned you on " + card.title,
      "<p>" + escapeHtml(S.me.Title) + " mentioned you on <strong>" +
      escapeHtml(card.title) + "</strong>:</p><p>" + escapeHtml(text) + "</p>" +
      '<p><a href="' + escapeHtml(cardLink(card)) + '">Open the card</a></p>'
    ).then(function () {
      if (DATA.kind === "live") { toast("Notified " + to.join(", "), "good"); }
    }).catch(function (err) {
      logDiag("Mention mail failed: " + err.message);
      toast("Comment saved, but the notification did not send: " +
        String(err.message).slice(0, 140), "bad", 9000);
    });
  }

  function escapeHtml(v) {
    return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function openCard(id) {
    var card = findCard(id);
    if (card) { openEditor(card); }
  }

  function reload() {
    return DATA.loadCards().then(function (cards) {
      S.cards = cards;
      renderView(); refreshCounts();
    }).catch(function (err) { fail(err, "Refresh failed"); });
  }

  function exportCsv() {
    var rows = [["Key", "Title", "Bucket", "Assigned to", "Progress", "Priority", "Start", "Due",
      "Completed", "Labels", "Checklist", "Docs", "Comments", "Created by", "Last update", "Notes"]];
    visibleCards().forEach(function (c) {
      var chk = checklistCount(c);
      rows.push([
        c.key, c.title, cfgBucket(c.bucket).name,
        (c.assignees || []).map(function (p) { return p.name; }).join("; "),
        c.progress, c.priority, fmtDate(c.start), fmtDate(c.due), fmtDate(c.completed),
        (c.labels || []).map(function (k) { return cfgLabel(k).name; }).join("; "),
        chk.total ? chk.done + "/" + chk.total : "", c.files || 0, c.comments || 0,
        c.createdBy, fmtDate(c.modified), (c.notes || "").replace(/\s+/g, " ")
      ]);
    });
    var csv = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    var a = h("a", { href: URL.createObjectURL(blob), download: "routing-desk-" + dayKey(new Date()) + ".csv" });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("Exported " + (rows.length - 1) + " cards", "good");
  }

  /* ---------- buckets ---------- */

  function addBucket() {
    var input = h("input.rd-input", { type: "text", placeholder: "Bucket name" });
    openModal({
      title: "Add bucket", body: field("Name", input),
      actions: [{ text: "Cancel" }, {
        text: "Add", primary: true, run: function () {
          var name = input.value.trim();
          if (!name) { return; }
          S.config.buckets.push({ key: "b" + uid(), name: name, tone: "#5b6b78" });
          persistConfig();
        }
      }]
    });
  }

  function renameBucket(key) {
    var bucket = cfgBucket(key);
    var input = h("input.rd-input", { type: "text", value: bucket.name });
    var tone = h("input", { type: "color", value: bucket.tone || "#5b6b78" });
    openModal({
      title: "Rename bucket",
      body: h("div", {}, [field("Name", input), field("Header colour", tone)]),
      actions: [{ text: "Cancel" }, {
        text: "Save", primary: true, run: function () {
          bucket.name = input.value.trim() || bucket.name;
          bucket.tone = tone.value;
          persistConfig();
        }
      }]
    });
  }

  function deleteBucket(key) {
    if (S.config.buckets.length < 2) { toast("Keep at least one bucket.", "bad"); return; }
    var count = S.cards.filter(function (c) { return c.bucket === key; }).length;
    var target = S.config.buckets.filter(function (b) { return b.key !== key; })[0];
    confirmBox("Delete bucket?",
      count ? count + " card(s) will move to " + target.name + "." : "This bucket is empty.",
      "Delete bucket", function () {
        var moving = S.cards.filter(function (c) { return c.bucket === key; });
        S.config.buckets = S.config.buckets.filter(function (b) { return b.key !== key; });
        Promise.all(moving.map(function (c) {
          c.bucket = target.key;
          return saveCard(c, { bucket: target.key }, "Bucket removed - moved to " + target.name);
        })).then(persistConfig).catch(function (err) { fail(err, "Bucket delete"); });
      }, true);
  }

  function persistConfig() {
    return DATA.saveConfig(S.config).then(function () {
      var titleNode = q(".rd-title");
      if (titleNode) { titleNode.textContent = S.config.planName || "Routing Desk"; }
      renderView(); refreshCounts();
    }).catch(function (err) { fail(err, "Could not save settings"); });
  }

     15. settings / setup / diagnostics
     ========================================================= */

  function openSettings() {
    var cfg = JSON.parse(JSON.stringify(S.config));
    var body = h("div");

    var planName = h("input.rd-input", { type: "text", value: cfg.planName });
    var dueSoon = h("input.rd-input", { type: "number", min: "1", max: "30", value: String(cfg.dueSoonDays) });

    var allowDelete = h("input", { type: "checkbox", checked: !!cfg.allowDelete });
    var notifyOn = h("input", { type: "checkbox", checked: !!cfg.notify.enabled });
    var notifyAssign = h("input", { type: "checkbox", checked: !!cfg.notify.onAssign });
    var notifyComment = h("input", { type: "checkbox", checked: !!cfg.notify.onComment });
    var subjectTag = h("input.rd-input", { type: "text", value: cfg.notify.subjectTag || "" });

    body.appendChild(h("div.rd-grid2", {}, [
      field("Board name", planName, true),
      field("Due soon threshold (days)", dueSoon),
      field("Idle warning (days)", staleDays)
    ]));

    body.appendChild(h("h3.rd-sec", { text: "Behaviour" }));
    body.appendChild(h("label.rd-row", {}, [allowDelete, h("span.rd-row-main", {}, [
      h("div.rd-row-t", { text: "Allow deleting cards and documents" }),
      h("div.rd-row-s", { text: "Deleted items go to the site recycle bin" })
    ])]));

    body.appendChild(h("h3.rd-sec", { text: "Email notifications" }));
    body.appendChild(h("div.rd-list", {}, [
      h("label.rd-row", {}, [notifyOn, h("span.rd-row-main", {}, [
        h("div.rd-row-t", { text: "Send email from SharePoint" }),
        h("div.rd-row-s", { text: "Uses the site's mail service. Recipients must be site users." })
      ])]),
      h("label.rd-row", {}, [notifyAssign, h("span.rd-row-main", {}, [h("div.rd-row-t", { text: "When someone is assigned a card" })])]),
      h("label.rd-row", {}, [notifyComment, h("span.rd-row-main", {}, [h("div.rd-row-t", { text: "When a comment is posted" })])])
    ]));
    body.appendChild(field("Subject prefix", subjectTag, true));
    body.appendChild(h("div", {}, [
      h("button.rd-btn.rd-btn--sm", {
        type: "button", text: "Send a test email to myself",
        on: {
          click: function (e) {
            var btn = e.currentTarget;
            btn.disabled = true;
            if (!S.me.Email) {
              toast("Your SharePoint profile has no email address on it.", "bad", 8000);
              btn.disabled = false;
              return;
            }
            DATA.sendMail([S.me.Email],
              (subjectTag.value.trim() || "[Routing Desk]") + " Test",
              "<p>Routing Desk can send mail from this site.</p>")
              .then(function () {
                toast("Test sent to " + S.me.Email + ". Delivery can lag a few minutes.", "good", 9000);
              })
              .catch(function (err) {
                toast("Mail failed: " + String(err.message).slice(0, 200), "bad", 12000);
              })
              .then(function () { btn.disabled = false; });
          }
        }
      }),
      h("div.rd-hint", {
        text: "SharePoint only delivers to people who are members of this site."
      })
    ]));

    body.appendChild(h("h3.rd-sec", { text: "Buckets" }));
    var bucketList = h("div.rd-list");
    function paintBuckets() {
      clear(bucketList);
      cfg.buckets.forEach(function (b, i) {
        bucketList.appendChild(h("div.rd-row", {}, [
          h("input", {
            type: "color", value: b.tone || "#5b6b78", "aria-label": "Colour for " + b.name,
            on: { change: function (e) { b.tone = e.target.value; } }
          }),
          h("input.rd-input.rd-row-main", {
            type: "text", value: b.name, on: { change: function (e) { b.name = e.target.value; } }
          }),
          h("button.rd-btn.rd-btn--sm", {
            type: "button", text: "↑", "aria-label": "Move up", disabled: i === 0,
            on: { click: function () { cfg.buckets.splice(i - 1, 0, cfg.buckets.splice(i, 1)[0]); paintBuckets(); } }
          }),
          h("button.rd-btn.rd-btn--sm", {
            type: "button", text: "↓", "aria-label": "Move down", disabled: i === cfg.buckets.length - 1,
            on: { click: function () { cfg.buckets.splice(i + 1, 0, cfg.buckets.splice(i, 1)[0]); paintBuckets(); } }
          })
        ]));
      });
      bucketList.appendChild(h("button.rd-btn.rd-btn--sm", {
        type: "button", text: "+ Add bucket",
        on: {
          click: function () {
            cfg.buckets.push({ key: "b" + uid(), name: "New bucket", tone: "#5b6b78" });
            paintBuckets();
          }
        }
      }));
    }
    paintBuckets();
    body.appendChild(bucketList);
    body.appendChild(h("div.rd-hint", { text: "Delete a bucket from its column menu on the board." }));

    body.appendChild(h("h3.rd-sec", { text: "Labels" }));
    var labelList = h("div.rd-list");
    cfg.labels.forEach(function (lab) {
      labelList.appendChild(h("div.rd-row", {}, [
        h("input", {
          type: "color", value: lab.tone, "aria-label": "Colour for " + lab.name,
          on: { change: function (e) { lab.tone = e.target.value; } }
        }),
        h("input.rd-input.rd-row-main", {
          type: "text", value: lab.name, on: { change: function (e) { lab.name = e.target.value; } }
        })
      ]));
    });
    body.appendChild(labelList);

    openModal({
      title: "Settings", wide: true, body: body,
      actions: [{ text: "Cancel" }, {
        text: "Save settings", primary: true, run: function () {
          cfg.planName = planName.value.trim() || "Routing Desk";
          cfg.dueSoonDays = Math.max(1, Number(dueSoon.value) || 3);
          cfg.staleDays = Math.max(1, Number(staleDays.value) || 7);
          cfg.allowDelete = allowDelete.checked;
          cfg.notify = {
            enabled: notifyOn.checked, onAssign: notifyAssign.checked,
            onComment: notifyComment.checked, subjectTag: subjectTag.value.trim() || "[Routing Desk]"
          };
          S.config = cfg;
          persistConfig().then(function () { toast("Settings saved", "good"); });
        }
      }]
    });
  }

  function openSetup() {
    var body = h("div");
    var status = h("div", { text: "Checking the site…" });
    var log = h("pre.rd-log", { hidden: true });
    body.appendChild(h("div.rd-hint", {
      text: "Routing Desk stores everything in this site. It needs three lists and one document library."
    }));
    body.appendChild(h("div", { style: { height: "10px" } }));
    body.appendChild(status);
    body.appendChild(log);

    var modal = openModal({
      title: "Setup and health check", wide: true, body: body,
      actions: [{ text: "Close" }]
    });

    if (DATA.kind === "demo") {
      clear(status);
      status.appendChild(h("div.rd-err", {
        text: "Running in demo mode — no SharePoint site is reachable from here. Paste this web part into a " +
          "Script Editor on your site and reload to run setup against real lists."
      }));
      return;
    }

    inspectSetup().then(function (report) {
      clear(status);
      var missing = report.filter(function (r) { return !r.exists || r.missing.length; });
      report.forEach(function (r) {
        var ok = r.exists && !r.missing.length;
        status.appendChild(h("div.rd-row", {}, [
          h("span.rd-pill" + (ok ? ".rd-pill--good" : ".rd-pill--bad"), { text: ok ? "OK" : "Missing" }),
          h("div.rd-row-main", {}, [
            h("div.rd-row-t", { text: r.spec.title + (r.spec.template === 101 ? "  (document library)" : "  (list)") }),
            h("div.rd-row-s", {
              text: !r.exists ? "Not created yet"
                : r.missing.length ? "Needs columns: " + r.missing.map(function (f) { return f[0]; }).join(", ")
                  : "All columns present"
            })
          ])
        ]));
      });

      if (!missing.length) {
        status.appendChild(h("div", { style: { "margin-top": "10px" } }, [
          h("span.rd-pill.rd-pill--good", { text: "Everything is in place" })
        ]));
        return;
      }

      var run = h("button.rd-btn.rd-btn--primary", {
        type: "button", text: "Create what is missing",
        on: {
          click: function () {
            run.disabled = true;
            log.hidden = false;
            log.textContent = "";
            provision(function (line) { log.textContent += line + "\n"; log.scrollTop = log.scrollHeight; })
              .then(function () {
                toast("Setup complete — reloading", "good");
                return boot(true);
              })
              .catch(function (err) {
                log.textContent += "\nFAILED: " + err.message +
                  "\n\nYou need Manage Lists rights on this site (site Owner or Full Control).";
                run.disabled = false;
              });
          }
        }
      });
      status.appendChild(h("div", { style: { "margin-top": "12px" } }, [run]));
      status.appendChild(h("div.rd-hint", { text: "Requires site Owner / Full Control. Existing lists are left alone." }));
    }).catch(function (err) {
      clear(status);
      status.appendChild(h("div.rd-err", { text: err.message }));
    });
    return modal;
  }

  function banner(text, kind, actionText, action) {
    clear(UI.banner);
    UI.banner.hidden = false;
    UI.banner.className = "rd-banner" + (kind === "bad" ? " rd-banner--bad" : "");
    UI.banner.appendChild(h("span", { text: text }));
    if (actionText) {
      UI.banner.appendChild(h("button.rd-btn.rd-btn--sm", { type: "button", text: actionText, on: { click: action } }));
    }
  }

  function bootScreen(text) {
    clear(APP);
    APP.appendChild(h("div.rd-boot", { text: text }));
  }

  function openDeepLink() {
    var m = /rdcard=([^&]+)/.exec(location.hash || "");
    if (!m) { return; }
    var key = decodeURIComponent(m[1]);
    var card = S.cards.filter(function (c) { return c.key === key; })[0];
    if (card) { openEditor(card); }
  }

  function boot(silent) {
    if (!silent) { bootScreen("Loading Routing Desk…"); }
    var forceDemo = /[?&#]rddemo=1/.test(location.href);

    var detect = forceDemo
      ? Promise.reject(new Error("demo requested"))
      : LIVE.me();

    return detect.then(function (me) {
      DATA = LIVE;
      S.me = me;
      S.demo = false;
      return inspectSetup().then(function (report) {
        var missing = report.filter(function (r) { return !r.exists || r.missing.length; });
        if (missing.length) {
          S.config = defaultConfig();
          buildShell();
          banner("Routing Desk is not set up on this site yet (" +
            missing.map(function (m) { return m.spec.title; }).join(", ") + ").", "bad",
            "Run setup", openSetup);
          renderView(); refreshCounts();
          return null;
        }
        return LIVE.warmup()
          .then(function () { return LIVE.loadConfig(); })
          .then(function (cfg) {
            if (cfg) { S.config = Object.assign(defaultConfig(), cfg); return null; }
            S.config = defaultConfig();
            return LIVE.saveConfig(S.config);
          })
          .then(function () { return LIVE.loadCards(); })
          .then(function (cards) {
            S.cards = cards;
            S.view = S.config.defaultView || "board";
            buildShell();
            renderView(); refreshCounts();
            openDeepLink();
          });
      });
    }).catch(function (err) {
      DATA = DEMO;
      S.demo = true;
      logDiag("Falling back to demo mode: " + (err && err.message));
      return DEMO.me().then(function (me) {
        S.me = me;
        return DEMO.loadConfig();
      }).then(function (cfg) {
        S.config = Object.assign(defaultConfig(), cfg);
        return DEMO.loadCards();
      }).then(function (cards) {
        S.cards = cards;
        buildShell();
        banner(forceDemo
          ? "Demo mode — sample data, nothing is saved."
          : "No SharePoint site reachable, so this is running on sample data. Nothing is saved.",
          null, "What is this?", function () {
            openModal({
              title: "Demo mode",
              body: h("div", { style: { "font-size": "13.5px", "line-height": "1.55" } }, [
                h("p", { text: "This file is a SharePoint Script Editor web part. Opened outside SharePoint it runs on sample data so you can click through it." }),
                h("p", { text: "Paste it into a Script Editor web part on your site, reload, and use the ⋯ menu → Setup to create the lists it needs. Add ?rddemo=1 to the page URL to force demo mode on purpose.", style: { "margin-top": "10px" } })
              ])
            });
          });
        renderView(); refreshCounts();
        openDeepLink();
      });
    }).catch(function (err) {
      bootScreen("");
      clear(APP);
      APP.appendChild(h("div", { style: { padding: "16px" } }, [
        h("div.rd-err", { text: "Routing Desk could not start.\n\n" + (err && (err.stack || err.message) || String(err)) })
      ]));
    });
  }

  /* etag refresh helpers (kept out of the adapters for clarity) */
  LIVE.refreshEtag = function (card) {
    return SP.get("web/lists/getbytitle('" + SP.esc(L.cards) + "')/items(" + card.id + ")?$select=Id")
      .then(function (item) { return (item.__metadata && item.__metadata.etag) || "*"; });
  };
  DEMO.refreshEtag = function () { return Promise.resolve("*"); };

  var savedTheme = null;
  try { savedTheme = localStorage.getItem("rd-theme"); } catch (e) { savedTheme = null; }
  if (savedTheme === "dark" || savedTheme === "light") {
    S.theme = savedTheme;
  } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    S.theme = "dark";
  } else {
    S.theme = "light";
  }
  APP.setAttribute("data-theme", S.theme);

  window.addEventListener("hashchange", openDeepLink);
  window.__ROUTING_DESK__ = { state: S, reload: reload, version: VERSION };

  /* Loader-stub teardown hook, same contract as the turnover log. */
  window.__RTG_DESTROY__ = function () {
    try {
      while (S.modalStack.length) { closeModal(); }
      closeMenu();
      window.removeEventListener("hashchange", openDeepLink);
      if (toastHost.parentNode) { toastHost.parentNode.removeChild(toastHost); }
      clear(APP);
      delete APP.dataset.booted;
    } catch (e) { /* noop */ }
  };

  boot();
})();
</script>
